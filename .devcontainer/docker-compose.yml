services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/cert_registry:cached
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: cert_registry
      PGUSER: cert_registry
      PGPASSWORD: devcontainer
      DATABASE_URL: ""
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cert_registry
      POSTGRES_USER: cert_registry
      POSTGRES_PASSWORD: devcontainer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../cart_registry.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
